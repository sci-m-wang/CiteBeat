id: record-0011
timestamp: 2026-06-13T18:00:00Z
summary: >-
  v0.3.1 adds a GitHub Pages delivery mode for the optional reporting
  feature. Static homepages cannot receive a POST, so instead of a plain
  request the extension commits the `citation.snapshot` JSON into the
  user's own repository through the official GitHub Contents API: GET the
  file to obtain its blob sha (404 means first write), then PUT with the
  sha, refreshing the sha and retrying once on a 409 conflict. Content is
  base64-encoded via TextEncoder because btoa alone throws on the
  non-ASCII paper titles that are common in this dataset, and each path
  segment is encoded separately so directory separators survive. The
  transport layer was generalised into requestOnce/requestWithRetry so
  both modes share timeout, bounded retry, and transient-only retry
  policy. The GitHub token is stored under its own top-level key,
  parallel to the existing endpoint secret, and is likewise excluded from
  exported backups.

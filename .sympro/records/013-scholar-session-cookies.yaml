id: record-0013
timestamp: 2026-11-06T09:48:13Z
summary: >-
  v0.3.5 sends Google Scholar requests with the browser's own cookies
  (credentials 'include') instead of 'omit'. Investigation of repeated
  verification failures showed the exit network is a datacenter range, and
  that a blank-profile Chrome is challenged from it while the user's normal
  browser window is not; the user then confirmed that a private window also
  demands verification. Cookies are therefore what separates the working
  browser from the extension, which had always run as if in a private window
  and could never benefit from a verification the user had already passed.
  Only Scholar requests change. Semantic Scholar and the reporting target
  keep 'omit', pinned by tests, so the browser's Google cookies can never be
  sent to the user's own node or to GitHub. PRIVACY.md, README and the store
  submission notes previously promised no cookies and no extra identifying
  data, which would have been false; they now say the browser attaches the
  existing Scholar cookies, that the extension cannot read them, and that
  nothing else receives them. The block message now tells the user to complete
  verification in the browser.
